<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>KI-Trading Leitstand</title>
  
  <!-- iOS PWA / Home Screen Optimierung -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Leitstand">
  <meta name="theme-color" content="#070a12">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='128' fill='%23070a12'/%3E%3Cpath d='M256 64 L384 192 L320 192 L320 384 L192 384 L192 192 L128 192 Z' fill='%2300e676'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='128' fill='%23070a12'/%3E%3Cpath d='M256 64 L384 192 L320 192 L320 384 L192 384 L192 192 L128 192 Z' fill='%2300e676'/%3E%3C/svg%3E">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #070a12;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    #app-container {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #070a12;
    }
    #app-frame {
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: none;
      display: none;
      background: #070a12;
    }
    /* Loading & Reconnect Overlay */
    #loader-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 25%, #152238 0%, #070a12 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      z-index: 1000;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    #loader-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .card {
      background: rgba(18, 26, 43, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 32px 24px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 35px rgba(0, 230, 118, 0.15);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 230, 118, 0.12);
      border: 1px solid rgba(0, 230, 118, 0.35);
      color: #00e676;
      font-size: 11px;
      font-weight: 800;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 20px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }
    .pulse {
      width: 8px;
      height: 8px;
      background: #00e676;
      border-radius: 50%;
      box-shadow: 0 0 10px #00e676;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.7; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.7; }
    }
    h1 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      color: #ffffff;
    }
    p {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(0, 230, 118, 0.2);
      border-top-color: #00e676;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .btn {
      display: inline-block;
      width: 100%;
      background: linear-gradient(135deg, #00e676 0%, #00b0ff 100%);
      color: #040d1a;
      font-weight: 800;
      font-size: 14px;
      padding: 13px 20px;
      border-radius: 12px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 230, 118, 0.25);
      margin-bottom: 10px;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #cbd5e1;
      box-shadow: none;
      font-weight: 600;
      font-size: 12px;
      padding: 10px 16px;
    }
    .footer {
      margin-top: 18px;
      font-size: 11px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div id="app-container">
    <iframe id="app-frame" sandbox="allow-scripts allow-forms allow-same-origin allow-popups" allow="autoplay; fullscreen"></iframe>
  </div>

  <div id="loader-overlay">
    <div class="card">
      <div class="badge">
        <span class="pulse"></span>
        <span>24/7 Live-Gateway</span>
      </div>
      <h1>KI-Trading Leitstand</h1>
      <p id="status-text">Verbinde sicher mit deinem iMac...</p>
      <div class="spinner" id="spinner"></div>
      
      <button id="retry-btn" class="btn" style="display:none;" onclick="startConnect(true)">Neu verbinden</button>
      <a href="#" id="direct-link" class="btn btn-secondary" style="display:none;" target="_blank">🔗 Direkt im Browser öffnen</a>
      
      <div class="footer">100 Jahre feste Adresse · Andy2407</div>
    </div>
  </div>

  <script>
    const GIST_ID = "b79827090844611bae94b1229bdf6ca4";
    const GIST_API = "https://api.github.com/gists/" + GIST_ID;
    const GIST_RAW = "https://gist.githubusercontent.com/Andy2407/" + GIST_ID + "/raw/tunnel_live_url.txt";
    const statusText = document.getElementById("status-text");
    const retryBtn = document.getElementById("retry-btn");
    const directLink = document.getElementById("direct-link");
    const spinner = document.getElementById("spinner");
    const appFrame = document.getElementById("app-frame");
    const loaderOverlay = document.getElementById("loader-overlay");

    let currentTunnelUrl = "";
    let isConnecting = false;
    let retryTimer = null;

    // Token aus URL oder localStorage lesen
    function getStoredToken() {
      const urlParams = new URLSearchParams(window.location.search);
      const urlToken = urlParams.get("token");
      if (urlToken) {
        try { localStorage.setItem("ki_token", urlToken); } catch(e){}
        return urlToken;
      }
      try {
        return localStorage.getItem("ki_token") || "";
      } catch(e) {
        return "";
      }
    }

    async function fetchLiveTunnelUrl() {
      // 1. Ungecachte GitHub REST API (Echtzeit ohne 5-Minuten CDN-Verzögerung)
      try {
        const apiRes = await fetch(GIST_API + "?t=" + Date.now(), {
          cache: "no-store",
          headers: { "Accept": "application/vnd.github+json" }
        });
        if (apiRes.ok) {
          const data = await apiRes.json();
          const fileObj = data && data.files && data.files["tunnel_live_url.txt"];
          const content = fileObj && fileObj.content ? String(fileObj.content).trim() : "";
          if (content && content.startsWith("http")) {
            return content;
          }
        }
      } catch (e) {}

      // 2. Fallback: Gist Raw URL
      const res = await fetch(GIST_RAW + "?t=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const txt = (await res.text()).trim();
      if (txt && txt.startsWith("http")) {
        return txt;
      }
      throw new Error("Ungueltige Tunnel-URL");
    }

    async function verifyTunnelAlive(baseOrigin) {
      try {
        const ctrl = new AbortController();
        const tid = setTimeout(() => ctrl.abort(), 3500);
        const r = await fetch(baseOrigin + "/api/health?t=" + Date.now(), {
          cache: "no-store",
          mode: "cors",
          signal: ctrl.signal
        });
        clearTimeout(tid);
        return r.ok;
      } catch (e) {
        return false;
      }
    }

    async function startConnect(manual = false) {
      if (isConnecting && !manual) return;
      isConnecting = true;
      if (retryTimer) clearTimeout(retryTimer);

      statusText.innerText = "Synchronisiere Echtzeit-Tunnel-Adresse...";
      spinner.style.display = "block";
      retryBtn.style.display = "none";

      try {
        const rawTunnel = await fetchLiveTunnelUrl();
        const baseOrigin = new URL(rawTunnel).origin;
        const storedToken = getStoredToken();
        let targetUrl = rawTunnel;
        if (storedToken && !rawTunnel.includes("token=")) {
          targetUrl = rawTunnel.includes("?") 
            ? `${rawTunnel}&token=${encodeURIComponent(storedToken)}`
            : `${rawTunnel}/?token=${encodeURIComponent(storedToken)}`;
        }

        currentTunnelUrl = rawTunnel;
        directLink.href = targetUrl;
        directLink.style.display = "inline-block";

        statusText.innerText = "Prüfe Live-Verbindung zum Leitstand...";
        const alive = await verifyTunnelAlive(baseOrigin);
        if (!alive) {
          throw new Error("Tunnel antwortet noch nicht");
        }

        // Iframe laden wenn neu oder geaendert
        if (!appFrame.src || !appFrame.src.startsWith(baseOrigin)) {
          statusText.innerText = "Leitstand wird geladen...";
          appFrame.src = targetUrl;
        }

        appFrame.onload = function() {
          appFrame.style.display = "block";
          loaderOverlay.classList.add("hidden");
          isConnecting = false;
        };

        // Fallback: Nur ausblenden, nachdem /api/health positiv verifiziert wurde
        setTimeout(() => {
          if (appFrame.src && appFrame.src.startsWith(baseOrigin)) {
            appFrame.style.display = "block";
            loaderOverlay.classList.add("hidden");
            isConnecting = false;
          }
        }, 2200);

      } catch (err) {
        isConnecting = false;
        statusText.innerText = "Tunnel wird aktualisiert... Automatischer Neuversuch in 3s.";
        retryBtn.style.display = "block";
        retryTimer = setTimeout(() => startConnect(false), 3000);
      }
    }

    // Auto-Resume nach iPhone Standby / App-Wechsel (verhindert schwarzen Bildschirm)
    document.addEventListener("visibilitychange", function() {
      if (!document.hidden) {
        // App wurde wieder aktiv: Pruefen ob Tunnel noch derselbe ist
        fetchLiveTunnelUrl().then(url => {
          if (url && url !== currentTunnelUrl) {
            // Tunnel hat sich geaendert: Neu verbinden
            loaderOverlay.classList.remove("hidden");
            startConnect(true);
          }
        }).catch(() => {});
      }
    });

    window.addEventListener("pageshow", function() {
      if (currentTunnelUrl) {
        fetchLiveTunnelUrl().then(url => {
          if (url && url !== currentTunnelUrl) {
            loaderOverlay.classList.remove("hidden");
            startConnect(true);
          }
        }).catch(() => {});
      }
    });

    window.addEventListener("online", function() {
      startConnect(true);
    });

    // Start beim Laden
    startConnect();
  </script>
</body>
</html>
